name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Check generated platform manifests
        run: python3 scripts/sync_manifests.py --check

      - name: Run validation and manifest regression tests
        run: python3 -m unittest discover -s tests -v

  installation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Check portable skills installation across agent targets
        run: python scripts/check_installation.py
