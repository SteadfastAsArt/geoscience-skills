name: Scientific Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MPLBACKEND: Agg
  PYVISTA_OFF_SCREEN: "true"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/science/requirements-core.txt
      - name: Install tested core scientific dependencies
        run: python -m pip install -r tests/science/requirements-core.txt
      - name: Check real LAS and SEG-Y processing
        run: python tests/science/test_io_scripts.py -v
      - name: Execute rock physics and seismic examples
        run: python tests/science/test_seismic_examples.py -v
      - name: Execute well log QC and formation evaluation examples
        run: python tests/science/test_well_log_examples.py -v
      - name: Execute Bruges and disba domain examples
        run: python tests/science/test_domain_examples.py -v
      - name: Read evaluation fixtures with lasio and segyio
        run: python evals/tests/test_fixture_readback.py -v
      - name: Check published field well logs and earthquake waveforms
        run: |
          python tests/science/test_field_well_logs.py -v
          python tests/science/test_field_seismic_waveform.py -v

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/science/requirements-models.txt
      - name: Install tested modelling dependencies
        run: python -m pip install -r tests/science/requirements-models.txt
      - name: Execute model input, inversion result, and grid export examples
        run: python tests/science/test_model_examples.py -v
      - name: Check observed GNSS data and uncertainty diagnostics
        run: python tests/science/test_field_data.py -v
      - name: Check field ERT holdout and independent synthetic recovery
        run: python tests/science/test_field_ert_survey.py -v
      - name: Execute near-surface ERT workflow and export checks
        run: python tests/science/test_near_surface_workflow_ert.py -v

  hydro-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/science/requirements-hydro-workflow.txt
      - name: Install isolated Pastas workflow dependencies
        run: python -m pip install -r tests/science/requirements-hydro-workflow.txt
      - name: Execute groundwater field workflow and held-out checks
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/hydro-mpl
          NUMBA_THREADING_LAYER: workqueue
        run: python tests/science/test_hydro_workflow.py -v

  climate-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/science/requirements-climate-workflow.txt
      - name: Install isolated climate workflow dependencies
        run: python -m pip install -r tests/science/requirements-climate-workflow.txt
      - name: Execute station climate workflow and calendar/spatial checks
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/climate-mpl
        run: python tests/science/test_climate_workflow.py -v

  mt-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/science/requirements-near-surface-mt.txt
      - name: Install isolated MTpy-v2 dependencies
        run: python -m pip install -r tests/science/requirements-near-surface-mt.txt
      - name: Execute EDI import, tensor QC/rotation and output readback
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mt-mpl
        run: python tests/science/test_near_surface_workflow_mt.py -v

  gpr-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/science/requirements-near-surface-gpr.txt
      - name: Install isolated GPR dependencies and fixed upstream source
        run: |
          python -m pip install -r tests/science/requirements-near-surface-gpr.txt
          python -m pip install https://github.com/NSGeophysics/GPRPy/archive/3b1f75eba820764b2147568fc0cc40f3a47919d5.zip
      - name: Execute GPR import, processing, units and export checks
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/gpr-mpl
        run: python tests/science/test_near_surface_workflow_gpr.py -v

  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/science/requirements-collection.txt
      - name: Install tested collection dependencies
        run: python -m pip install -r tests/science/requirements-collection.txt
      - name: Install pinned MODFLOW executable in the runner's temporary directory
        run: python scripts/install_modflow_test.py --directory "$RUNNER_TEMP/modflow-bin"
      - name: Execute new library examples and MODFLOW analytic benchmark
        env:
          MODFLOW_EXE: ${{ runner.temp }}/modflow-bin/mf6
        run: python tests/science/test_collection_examples.py -v

  domain-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/science/requirements-audits.txt
      - name: Install DLIS, GIS and structural audit dependencies
        run: python -m pip install -r tests/science/requirements-audits.txt
      - name: Execute audited domain examples
        run: |
          python tests/science/test_dlis_examples.py -v
          python tests/science/test_gis_examples.py -v
          python tests/science/test_loopstructural_examples.py -v

  petropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/science/requirements-audits-petropy.txt
      - name: Install isolated PetroPy and compatible lasio
        run: python -m pip install -r tests/science/requirements-audits-petropy.txt
      - name: Execute configured fluid and multimineral examples
        run: python tests/science/test_petropy_examples.py -v

  pygmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: geoscience-pygmt
          environment-file: tests/science/environment-pygmt.yml
          miniforge-version: latest
          auto-activate-base: false
      - name: Execute real GMT rendering and grid sampling
        shell: bash -el {0}
        run: python tests/science/test_pygmt_examples.py -v
